server.port=${PORT:8080}
# Use H2 by default when no DB_HOST is configured so the backend can run locally without Docker/Postgres.
spring.datasource.url=${DB_URL:jdbc:h2:mem:student_rental_marketplace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:local-demo-secret-key-change-this-before-deployment-123456789}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
