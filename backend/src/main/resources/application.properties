server.port=${PORT:8080}
# Use H2 by default when no DB_HOST is configured so the backend can run locally without Docker/Postgres.

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:require}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:local-demo-secret-key-change-this-before-deployment-123456789}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
