server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:student_rental_marketplace}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USERNAME:student_rental_user}
spring.datasource.password=${DB_PASSWORD:student_rental_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:local-demo-secret-key-change-this-before-deployment-123456789}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
